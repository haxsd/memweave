[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memweave"
version = "0.2.5"
description = "Local task continuity and lasting understanding for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/planning-with-files/LICENSE"]
keywords = ["mcp", "agents", "memory", "task-continuity", "knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp==2.3.0",
    "filelock==3.20.0",
    "pathspec==0.12.1",
    "tomlkit==0.13.3",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.6.1",
    "PyYAML>=6.0.1",
    "python-frontmatter>=1.1.0",
    "markdown-it-py>=3.0.0",
    "unidecode>=1.3.8",
    "loguru>=0.7.3",
    "dateparser>=1.2.0",
    "fastapi>=0.115",
    "logfire>=4.19.0",
    "alembic>=1.14.1",
    "aiofiles>=24.1.0",
]

[project.urls]
Homepage = "https://github.com/haxsd/memweave"
Repository = "https://github.com/haxsd/memweave"
Issues = "https://github.com/haxsd/memweave/issues"
Changelog = "https://github.com/haxsd/memweave/blob/main/CHANGELOG.md"

[project.scripts]
memweave = "memweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memweave = ["static/*.html", "skills/*/*.md"]
basic_memory = [
    "alembic/*.ini",
    "alembic/*.mako",
    "alembic/versions/*.py",
]
