[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memweave"
version = "0.2.4"
description = "Local task continuity and lasting understanding for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "filelock==3.20.0", "pathspec==0.12.1", "tomlkit==0.13.3"]

[project.scripts]
memweave = "memweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memweave = ["static/*.html", "skills/*/*.md"]
