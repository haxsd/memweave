  <style id="workspace-v2">
    :root{
      color-scheme:light;
      --paper:#f3f5f1;
      --card:#ffffff;
      --ink:#17231f;
      --muted:#68736d;
      --line:#dfe5de;
      --indigo:#204d43;
      --indigo-soft:#e7f0ec;
      --teal:#2d6c5f;
      --teal-soft:#e4f1eb;
      --danger:#b34742;
      --radius:18px;
      --shadow:0 1px 2px rgba(19,39,32,.04),0 18px 42px rgba(23,54,44,.06);
      --sidebar:#14211d;
    }
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 76% -15%,rgba(207,226,215,.72),transparent 34%),
        linear-gradient(180deg,#f5f7f3 0%,var(--paper) 45%);
      color:var(--ink);
      font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
      font-size:14px;
      line-height:1.62;
    }
    button:hover{filter:none}
    h1{font-size:31px;line-height:1.25;letter-spacing:-1.2px;font-weight:680}
    h2{font-size:18px;line-height:1.35;letter-spacing:-.25px}
    h3{font-size:14px}
    .app{grid-template-columns:236px minmax(0,1fr)}
    .sidebar{
      position:sticky;top:0;height:100vh;z-index:30;
      padding:28px 18px 22px;gap:29px;border-right:0;
      background:
        radial-gradient(circle at 15% 4%,rgba(191,229,212,.10),transparent 28%),
        linear-gradient(180deg,#13201c 0%,#182c26 100%);
      color:#dbe7e1;
    }
    .brand{gap:13px}
    .brand-mark{
      width:41px;height:41px;border-radius:12px;
      background:#d9b56b;color:#14211d;
      box-shadow:0 10px 24px rgba(0,0,0,.22);

    .brand-title{color:#f8fbf9;font-size:21px;letter-spacing:6px}
    .brand-sub{color:#82958d;font-size:9px;letter-spacing:2.8px}
    .side-label{color:#758981;font-size:10px;letter-spacing:1.45px}
    .nav{gap:5px;scrollbar-width:none}
    .nav::-webkit-scrollbar{display:none}
    .nav button{
      min-height:43px;padding:10px 13px;border-radius:11px;
      color:#a9b8b2;font-weight:500;letter-spacing:.01em;
    }
    .nav button:hover{background:#20362f;color:#f4f8f6}

      border-bottom-color:rgba(214,222,215,.86);
      background:rgba(244,246,242,.91);
      backdrop-filter:blur(18px);

    .project-control{align-items:flex-start;gap:11px}

      font-weight:620;box-shadow:0 1px 2px rgba(18,36,29,.04);

      min-height:37px;padding:8px 14px;border-color:#d9e0d9;border-radius:10px;
      background:#fff;box-shadow:0 1px 2px rgba(18,36,29,.03);
      font-weight:560;transition:background .16s,border-color .16s,color .16s,transform .16s;
    }
    .btn:hover{border-color:#c7d2c9;background:#fbfcfa}
    .btn.primary{background:#1e4b40;border-color:#1e4b40;color:#fff;box-shadow:0 9px 22px rgba(30,75,64,.18)}

      position:relative;isolation:isolate;overflow:hidden;
      padding:27px 30px 25px;border-radius:22px;color:#f8fbfa;
      background:
        radial-gradient(circle at 92% -20%,rgba(188,228,208,.28),transparent 31%),
        linear-gradient(135deg,#18372f 0%,#205548 58%,#2c6d5d 100%);
      box-shadow:0 24px 58px rgba(20,61,49,.22);

      box-shadow:0 0 0 42px rgba(222,243,232,.035),0 0 0 94px rgba(222,243,232,.025);

    .focus-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .focus-kicker{font-size:10px;letter-spacing:.13em;font-weight:750;color:#c5ddd3;text-transform:uppercase}
    .focus-card .badge{background:rgba(255,255,255,.13);color:#eff8f4;border:1px solid rgba(255,255,255,.11)}
    .focus-meta{margin-left:auto;color:#c5d7d0;font:11px/1.5 Consolas,monospace}
    .focus-title{max-width:800px;margin:13px 0 8px;color:#fff;font-size:27px;letter-spacing:-.7px;line-height:1.32}
    .focus-goal{max-width:820px;color:#d6e6df;font-size:13px;line-height:1.7}

      display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:start;

    }
    .focus-next-label{color:#bcd5ca;font-size:11px;font-weight:700;letter-spacing:.08em;padding-top:2px}
    .focus-next p{color:#f1f8f5;font-size:13px;line-height:1.7}
    .focus-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:19px}
    .focus-card .btn{box-shadow:none}
    .focus-card .btn.primary{background:#f7fbf8;border-color:#f7fbf8;color:#173b31}
    .focus-card .btn.quiet{background:transparent;border-color:rgba(255,255,255,.22);color:#e7f2ed}
    .focus-footer-note{margin-left:auto;color:#bfd3ca;font-size:11px}
    .focus-empty{color:#c9dbd4;font-size:13px;margin-top:12px}
    .stats{gap:13px;margin:0}
    .stat{
      padding:17px 18px 16px;border-color:#e0e6df;border-radius:16px;
      background:rgba(255,255,255,.86);box-shadow:var(--shadow);
    }
    .stat-label{font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:none;color:#6a7670}
    .stat-value{font-size:29px;line-height:1.18;letter-spacing:-.7px;margin:7px 0 3px;color:#1d3a31;font-weight:670}
    .stat-note{font-size:11px;color:#7a8580}
    .overview-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.78fr);gap:17px;align-items:start}
    .panel{border-color:#e0e6df;border-radius:17px;background:var(--card);box-shadow:var(--shadow)}
    .panel-head{padding:17px 20px;border-color:#edf0eb}
    .panel-head h2{font-size:15px;font-weight:680;letter-spacing:-.1px}
    .panel-head>small{font-size:11px;color:#818c86}
    .panel-body{padding:19px 20px}
    .task-list{display:grid}
    .task-card{padding:16px 20px;border-bottom:1px solid #edf0eb;background:#fff;transition:background .16s}
    .task-card:last-child{border-bottom:0}
    .task-card:hover{background:#fbfcfa}
    .task-card.is-current{background:linear-gradient(90deg,#f1f8f4 0%,#fff 78%);box-shadow:inset 3px 0 #4e8a76}
    .task-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
    .task-heading{display:flex;align-items:flex-start;gap:10px;min-width:0}
    .task-title-button{font-weight:660;line-height:1.55;text-align:left;overflow-wrap:anywhere}
    .task-title-button:hover{color:#2a6658;text-decoration:none}
    .task-step{margin-top:7px;color:#5f6d66;font-size:12.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .task-step strong{color:#315f52;font-weight:650}
    .task-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;color:#89928d;font-size:10.5px}
    .task-meta code{font:10px/1.4 Consolas,monospace;color:#7b8781;background:#f4f6f2;padding:2px 6px;border-radius:5px}
    .task-context{margin:2px 20px 20px;padding:14px 0 0;border-top:1px solid #e9eee9}
    .task-context .section-label{margin-top:0;text-transform:none;letter-spacing:.05em}
    .task-context-list{display:grid;gap:9px;margin:0}
    .task-context-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start}
    .task-context-row dt{color:#7d8982;font-size:10.5px;font-weight:650}
    .task-context-row dd{margin:0;color:#59665f;font-size:11.5px;line-height:1.65;overflow-wrap:anywhere}
    .checkpoint-mini{padding:10px 0;border-bottom:1px solid #edf0eb}
    .checkpoint-mini:last-child{border-bottom:0;padding-bottom:0}
    .checkpoint-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .checkpoint-head strong{font-size:11.5px;color:#3d5d52}.checkpoint-head span{font:10px/1.4 Consolas,monospace;color:#89938d}
    .checkpoint-mini p{margin-top:4px;color:#68746d;font-size:11px;line-height:1.65}
    .work-unit-mini{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid #edf0eb}
    .work-unit-mini:last-child{border-bottom:0;padding-bottom:0}
    .work-unit-head{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}
    .work-unit-head strong{font-size:11.5px;color:#3d5d52;line-height:1.55}
    .work-unit-head .badge{font-size:9.5px;padding:1px 6px}
    .work-unit-mini p{color:#748079;font-size:10.5px;line-height:1.6}
    .badge{border-radius:6px;background:#e8f0ec;color:#2c6658;font-weight:620}
    .badge.done{background:#e6f3ec;color:#28745d}
    .badge.grey{background:#f0f1ed;color:#69716c}
    .list-item{padding:16px 20px;border-bottom-color:#edf0eb}
    .list-title h3{font-size:14px}
    .list-item p{font-size:12.5px;line-height:1.7}
    .meta-row{gap:8px;margin-top:9px}
    .link-button{font-weight:600}
    .memory-summary{padding-top:17px}
    .memory-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
    .memory-metric{padding:11px 12px;border:1px solid #e8ece7;border-radius:11px;background:#fafbf9}
    .memory-metric strong{display:block;font-size:20px;line-height:1.15;color:#233e34;font-variant-numeric:tabular-nums}
    .memory-metric span{display:block;margin-top:3px;color:#7b8580;font-size:10.5px}
    .section-label{margin:17px 0 8px;color:#76817b;font-size:10px;font-weight:720;letter-spacing:.09em;text-transform:uppercase}
    .memory-mini-list{display:grid;gap:2px}
    .memory-mini{
      display:block;width:100%;padding:11px 0;border:0;border-bottom:1px solid #eef1ed;
      background:transparent;text-align:left;border-radius:0;color:var(--ink);
    }
    .memory-mini:last-child{border-bottom:0;padding-bottom:3px}
    .memory-mini:hover strong{color:#2b685a}
    .memory-mini-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .memory-mini-head strong{font-size:12.5px;line-height:1.55;transition:color .16s}
    .memory-kind{flex:0 0 auto;color:#7d8982;font-size:10px;border:1px solid #e4e9e3;border-radius:999px;padding:1px 7px;background:#fafbf9}
    .memory-mini-copy{display:block;margin-top:4px;color:#77827c;font-size:11px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .scope-note{line-height:1.7;color:#7a857f}
    .global-summary{margin-top:14px;border-top:1px solid #edf0eb;padding-top:11px}
    .global-summary summary{cursor:pointer;list-style:none;color:#64716a;font-size:11.5px;font-weight:600}
    .global-summary summary::-webkit-details-marker{display:none}
    .global-summary summary::after{content:"＋";float:right;color:#8b968f;font-weight:500}
    .global-summary[open] summary::after{content:"−"}
    .global-body{padding:9px 0 1px;color:#78837d;font-size:11px;line-height:1.7}
    .project-root-line{margin-top:18px;color:#84908a;font:10.5px/1.5 Consolas,monospace;overflow-wrap:anywhere}
    .search-form{
      padding:10px;border:1px solid #e1e7e0;border-radius:14px;background:#fff;
      box-shadow:var(--shadow);max-width:780px;
    }
    .search-form input,.search-form select{border-color:#e2e7e1;background:#fbfcfa}
    .onboarding{border-color:#cedbd2;background:linear-gradient(135deg,#ffffff,#f7faf7);box-shadow:var(--shadow)}
    .notice{border-radius:11px}
    .footnote{margin-top:26px;color:#8b958f}
    @media(max-width:1100px){
      .app{grid-template-columns:204px minmax(0,1fr)}
      .main{padding:0 25px 34px}
      .overview-grid{grid-template-columns:1fr}
      .memory-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
      .focus-title{font-size:24px}
      .project-control select{max-width:260px}
    }
    @media(max-width:760px){
      .app{display:block}
      .sidebar{position:static;height:auto;padding:17px 18px;gap:17px;border-bottom:0}
      .side-label,.side-note{display:none}
      .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;overflow:visible;padding-bottom:0}
      .nav button{min-height:40px;padding:8px 2px;gap:5px;white-space:nowrap;font-size:11px;justify-content:center}
      .nav svg{width:14px;height:14px}
      .main{padding:0 16px 30px}
      .topbar{position:static;min-height:0;padding:12px 0 14px;align-items:flex-start}
      .project-picker{min-width:0;width:100%}
      .project-control{display:grid;gap:5px;width:100%}
      .project-control label{display:block;font-size:9.5px;letter-spacing:.06em;padding:0}
      .project-control select{max-width:none;width:100%}
      .project-root{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .actions{width:100%;justify-content:flex-end}
      .page-head{margin:23px 0 18px;align-items:flex-start;gap:14px;flex-wrap:wrap}
      h1{font-size:25px}
      .focus-card{padding:22px 20px;border-radius:18px}
      .focus-title{font-size:21px}
      .focus-meta{width:100%;margin-left:0}
      .focus-next{grid-template-columns:1fr;gap:4px}
      .focus-footer-note{width:100%;margin-left:0}
      .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .stat{padding:12px 10px;border-radius:12px}
      .stat-label{font-size:10px}
      .stat-value{font-size:23px}
      .stat-note{font-size:9.5px;line-height:1.4}
      .panel-head,.panel-body{padding-left:16px;padding-right:16px}
      .overview-grid{grid-template-columns:1fr}
      .task-card{padding:15px 16px}
      .topbar .actions .btn{font-size:11px;padding:7px 10px;min-height:32px}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 26 26" fill="none"><path d="M5 3v20M13 3v20M21 3v20M3 7h20M3 15h20M3 21h20" stroke="currentColor" stroke-width="1.5"/><path d="M9 3v20M17 3v20" stroke="currentColor" stroke-opacity=".4"/></svg></div>
        <div><div class="brand-title">织忆</div><div class="brand-sub">MEMWEAVE</div></div>
      </div>
      <div>
        <div class="side-label">WORKSPACE / 工作空间</div>
        <nav class="nav" aria-label="主要导航">
          <button type="button" data-view="overview" aria-current="page"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1" stroke="currentColor"/><rect x="12" y="3" width="5" height="5" rx="1" stroke="currentColor"/><rect x="3" y="12" width="5" height="5" rx="1" stroke="currentColor"/><rect x="12" y="12" width="5" height="5" rx="1" stroke="currentColor"/></svg>工作总览</button>
          <button type="button" data-view="tasks"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="3" width="12" height="15" rx="2" stroke="currentColor"/><path d="m7 8 1.5 1.5L12 6M7 13h6" stroke="currentColor" stroke-linecap="round"/></svg>任务记忆</button>
          <button type="button" data-view="knowledge"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 5C7 2 3 3 2 4v12c3-2 6-1 8 1 2-2 5-3 8-1V4c-3-2-6-1-8 1Zm0 0v12" stroke="currentColor" stroke-linejoin="round"/></svg>长期知识</button>
          <button type="button" data-view="graph"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="4" r="2" stroke="currentColor"/><circle cx="4" cy="15" r="2" stroke="currentColor"/><circle cx="16" cy="15" r="2" stroke="currentColor"/><path d="m9 6-4 7m6-7 4 7M6 15h8" stroke="currentColor"/></svg>项目图谱</button>
        </nav>
      </div>
      <div class="side-note"><strong><span class="local-dot"></span>本地优先</strong>任务工作记忆<br>项目长期知识<div style="margin-top:16px;font-size:10px;letter-spacing:1px">MARKDOWN + SQLITE</div></div>
    </aside>
    <main class="main" id="content" tabindex="-1">
      <header class="topbar">
        <div class="project-control"><label for="project-select">当前项目</label><div class="project-picker"><select id="project-select" disabled><option value="">正在连接…</option></select><span class="project-root" id="project-root">正在读取项目目录…</span></div></div>
        <div class="actions"><button class="btn quiet small" id="auth-button" type="button">连接设置</button><button class="btn small" id="register-button" type="button">＋ 注册项目</button></div>
      </header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div class="page-head"><div><div class="eyebrow" id="page-eyebrow">A CONTINUOUS WORKSPACE</div><h1 id="page-title">把工作，接着往下做。</h1><p id="page-description">从上次停下的地方，找回清晰的下一步。</p></div><button class="btn primary" id="page-action" type="button" hidden>＋ 开始新任务</button></div>
      <div id="view-content" aria-busy="true"><div class="loading" role="status">正在读取本地工作空间…</div></div>
      <footer class="footnote"><span>理解与提炼由宿主 Agent 完成 · 内容保存在本地</span><span id="connection-state">等待连接</span></footer>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="close-dialog" aria-label="关闭对话框">×</button></div><div class="dialog-body" id="dialog-body"></div></dialog>
  <script>
    "use strict";
    const $ = (selector) => document.querySelector(selector);
    const state = {projects:[], projectId:"", projectRootHint:"", view:"overview", tasks:[], currentTaskId:"", currentTaskDetail:null, overviewMemories:[], overviewMemoryError:"", memories:[], memoryFilter:{query:"",scope:"project",status:"active"}, graph:null, status:null, generation:0, dialogGeneration:0, token:"", pending:new Map()};
    const viewInfo = {
      overview:["PROJECT WORKSPACE","项目工作台","当前任务、下一步与项目长期知识集中在一页。","＋ 新建任务"],
      tasks:["TASK MEMORY","任务记忆","按顺序查看当前任务、等待队列与历史记录。","＋ 新建任务"],
      knowledge:["LASTING KNOWLEDGE","长期知识","查阅有来源的项目经验，并区分项目、任务与用户范围。","＋ 记录知识"],
      graph:["PROJECT EVIDENCE","项目图谱","核对文件结构与架构记录，确认知识对应的实现证据。","扫描项目"]
    };
    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined && text !== null) element.textContent = String(text);
      return element;
    }
    function button(text, action, className="btn") {
      const element = node("button", className, text);
      element.type = "button";
      element.addEventListener("click", action);
      return element;
    }
    function currentProject() { return state.projects.find(project => project.id === state.projectId); }
    function normalizedPath(value) {
      return String(value || "").replaceAll("/", "\\").replace(/\\+$/, "").toLowerCase();
    }
    function updateProjectRoot() {
      const project = currentProject();
      const target = $("#project-root");
      target.textContent = project?.root || "尚未选择项目";
      target.title = project?.root || "";
    }
    function saveProjectSelection(projectId) {
      try { if (projectId) localStorage.setItem("memweave-project-id", projectId); } catch {}
    }
    function notify(message, type="info") {
      const container = $("#notice");
      container.className = "notice " + type;
      container.replaceChildren(node("span","",message),button("×",()=>{container.hidden=true;},""));
      container.lastChild.setAttribute("aria-label","关闭提示");
      container.hidden = false;
    }
    function friendlyError(error) {
      if (error.name === "AbortError") return "本地服务响应超时。请检查服务状态后重试；写入重试会沿用同一操作标识。";
      if (error.code === "SOURCE_CHANGED") return "来源文件已变化。请先核对文件，再勾选“重新扫描并同步当前来源哈希”后保存。";
      if (error.code === "SCOPE_DENIED") return "记录范围或项目不匹配，当前操作已被拒绝。请重新读取对应项目后再试。";
      if (error.code === "revision_conflict" || error.code === "conflict" || /revision|etag|conflict/i.test(error.code || "")) return "这条记录已在其他位置更新。请重新打开记录，核对最新内容后再保存。";
      if (error.httpStatus === 401 || error.httpStatus === 403) return "连接凭据无效或已过期。请在“连接设置”中更新本次会话令牌。";
      if (error instanceof TypeError) return "无法连接本地服务。请确认 MemWeave 仍在运行，然后重试。";
      return error.message || "操作未完成，请稍后重试。";
    }
    async function api(action, payload={}, method="POST") {
      if (!state.token) throw new Error("尚未提供连接令牌。请使用服务生成的页面链接，或在“连接设置”中输入令牌。");
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(),20000);
      try {
        const endpoint = action === "status" && method === "GET" ? "/api/status" : "/api/" + action;
        const response = await fetch(endpoint, {
          method, headers:{"Authorization":"Bearer " + state.token,"Content-Type":"application/json"},
          body:method === "GET" ? undefined : JSON.stringify(payload), signal:controller.signal, cache:"no-store", credentials:"omit"
        });
        let result;
        try { result = await response.json(); } catch { throw new Error("服务返回了无法读取的响应，请确认当前页面与服务版本一致。"); }
        if (!response.ok || result.status !== "ok") {
          const error = new Error(result.error?.message || "本地服务未能完成操作。");
          error.code = result.error?.code;
          error.httpStatus = response.status;
          throw error;
        }
        $("#connection-state").textContent = "已连接本地服务";
        return result.data;
      } finally { clearTimeout(timeout); }
    }
    async function mutate(action, payload) {
      const key = action + ":" + JSON.stringify(payload);
      if (!state.pending.has(key)) state.pending.set(key, crypto.randomUUID());
      const result = await api(action,{...payload,operation_id:state.pending.get(key)});
      state.pending.delete(key);
      return result;
    }
    function empty(title, description, actionText, action) {
      const container = node("div","empty");
      container.append(node("div","empty-symbol","◇"),node("strong","",title),node("p","",description));
      if (actionText) container.append(button(actionText,action,"btn small"));
      return container;
    }
    function panel(title, content, actionText, action) {
      const container = node("section","panel"), head = node("div","panel-head");
      head.append(node("h2","",title));
      if (actionText) head.append(button(actionText,action,"btn quiet small"));
      container.append(head,content);
      return container;
    }
    function badge(status) {
      const labels = {active:"进行中",current:"当前",queued:"排队中",open:"进行中",pending:"待开始",running:"运行中",blocked:"阻塞",in_progress:"进行中",completed:"已完成",cancelled:"已取消",stale:"待核对",deleted:"已遗忘",valid:"已启用",candidate:"候选 · 待确认",archived:"已归档",draft:"草稿"};
      return node("span","badge " + (status === "completed" || status === "valid" ? "done" : status === "cancelled" || status === "archived" ? "grey" : ""),labels[status] || status || "已记录");
    }
    function scopeLabel(scope) { return {project:"项目范围",task:"当前任务范围",user:"用户范围 · 跨项目"}[scope] || scope || "项目范围"; }
    function staleReasonLabel(reason) {
      const labels={source_hash_changed:"来源文件已变化",source_not_scanned:"来源尚未扫描",source_unavailable:"来源不可读取",missing_sources:"没有有效来源",invalid_source:"来源格式无效"};
      return labels[reason] || reason;
    }
    function shortHash(value) { const text=String(value || ""); return text.length > 16 ? text.slice(0, 12) + "…" + text.slice(-4) : (text || "—"); }
    function formatLocalTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat("zh-CN",{
        month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false
      }).format(date).replaceAll("/","-");
    }
    function isActive(task) { return !["completed","cancelled","archived"].includes(task.status); }
    function taskList(tasks) {
      if (!tasks.length) return empty("还没有任务记忆","从一个明确的目标开始，把验收条件和下一步保留下来。","开始新任务",openTaskForm);
      const list = node("div","task-list");
      for (const task of tasks) {
        const item = node("article","task-card" + (task.status === "current" ? " is-current" : ""));
        const title = node("div","task-card-top"), heading = node("div","task-heading");
        const titleButton = button(task.title || "未命名任务",()=>openTask(task.id),"link-button task-title-button");
        heading.append(titleButton);
        title.append(heading,badge(task.status));
        const next = node("p","task-step");
        const label = node("strong","",task.next_step ? "下一步 · " : "目标 · ");
        next.append(label,node("span","",task.next_step || task.goal || "打开任务查看详情与进展"));
        const meta = node("div","task-meta");
        meta.append(node("code","",shortHash(task.id)),node("span","","版本 " + (task.revision ?? "—")));
        if (task.updated_at) meta.append(node("span","","更新 " + formatLocalTime(task.updated_at)));
        item.append(title,next,meta);
        list.append(item);
      }
      return list;
    }
    function renderOnboarding() {
      const container = node("section","onboarding");
      container.append(node("div","eyebrow","YOUR FIRST THREAD"),node("h2","","为项目，织起第一段记忆。"),node("p","","注册本机项目目录后，就能记录任务、积累知识，并扫描项目结构。每个项目拥有明确的记忆边界。"),button("＋ 注册第一个项目",openProjectForm,"btn primary"));
      $("#view-content").replaceChildren(container);
    }
    async function loadProjects(preferredId) {
      const data = await api("project_list");
      state.projects = data.items || [];
      const selector = $("#project-select");
      selector.replaceChildren();
      if (!state.projects.length) selector.append(new Option("尚未注册项目",""));
      for (const project of state.projects) selector.append(new Option(project.title || project.name || project.root,project.id));
      let savedId = "";
      try { savedId = localStorage.getItem("memweave-project-id") || ""; } catch {}
      const preferred = state.projects.find(project=>project.id === preferredId);
      const hinted = state.projects.find(project=>normalizedPath(project.root) === normalizedPath(state.projectRootHint));
      const saved = state.projects.find(project=>project.id === savedId);
      const recent = state.projects.slice().sort((left,right)=>String(right.updated_at || "").localeCompare(String(left.updated_at || "")))[0];
      state.projectId = (preferred || hinted || saved || recent || state.projects[0])?.id || "";
      selector.value = state.projectId;
      selector.disabled = !state.projects.length;
      saveProjectSelection(state.projectId);
      updateProjectRoot();
      await renderView();
    }
    async function renderView() {
      const generation = ++state.generation, projectId = state.projectId, view = state.view;
      const info = viewInfo[view];
      $("#page-eyebrow").textContent=info[0];$("#page-title").textContent=info[1];$("#page-description").textContent=info[2];
      $("#page-action").textContent=info[3];$("#page-action").hidden=!projectId;
      document.querySelectorAll("[data-view]").forEach(element=>{
        if (element.dataset.view === view) element.setAttribute("aria-current","page"); else element.removeAttribute("aria-current");
      });
      const container = $("#view-content");
      if (!projectId) { container.setAttribute("aria-busy","false");renderOnboarding();return; }
      container.setAttribute("aria-busy","true");container.replaceChildren(node("div","loading","正在读取项目内容…"));
      try {
        if (view === "overview") {
          const [tasks,status,knowledgePreview] = await Promise.all([
            api("task_list",{project_id:projectId}),
            api("status",{project_id:projectId}),

      const cancel=button("取消",()=>$("#dialog").close(),"btn"),submit=button(submitText,()=>{},destructive ? "btn danger" : "btn primary");submit.type="submit";
      footer.append(cancel,submit);form.append(...fields,errorBox,footer);body.append(form);

        try{await handler(new FormData(form));}

        $("#view-content").setAttribute("aria-busy","false");
        $("#view-content").replaceChildren(empty("连接你的本地记忆空间",friendlyError(error),"设置连接令牌",openAuth));
        notify(friendlyError(error),"error");
      }
    }
    start();
  </script>
</body>
</html>
