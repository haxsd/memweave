name: CI

# 最小 Linux CI：单 job、只跑 unittest，省 Actions 分钟。
# 测试入口与 docs/development.md 一致：python -m unittest discover -s tests -v
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unittest
        run: python -m unittest discover -s tests -v
