name: 功能建议
description: 提出可验证的产品或接入改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景、当前阻力和受影响客户端，而不只是技术方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小可行行为、调用入口、数据影响和兼容边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选。说明为什么现有流程不足，以及是否考虑过更小的改动。
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: 如何验证
      description: 提供一个可观察、可验收的成功条件。
    validations:
      required: true
